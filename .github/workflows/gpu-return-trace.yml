name: GPU return trace
on:
  push:
    branches: [gpu-return-trace]
  workflow_dispatch:
jobs:
  trace:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned official Base
        run: tools/install-bend.sh
      - name: Build unchanged compiler
        run: make
      - name: Compare isolated producer controls
        run: BEND_BASE="$HOME/.bend/bend2/base.bend" python3 tools/gpu-return-trace.py
      - name: Save raw control receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-return-trace
          path: build/gpu-return-trace
