name: CI

on:
  push:
  pull_request:
  # Mondays, and on demand: against the latest Bend rather than the pinned one
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  bootstrap:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install the official Bend (for base.bend, reference outputs and stage0)
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) BEND_NO_TELEMETRY=1 tools/install-bend.sh latest;;
            *) tools/install-bend.sh;;
          esac
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"

      - name: Install Bun (runs the JavaScript target's tests)
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Build bendc from the C seed
        run: make

      - name: Test suite
        run: make test

      - name: Seed is up to date (bendc.bend compiles to the seed)
        run: make selfcheck

      - name: bendc's checker accepts bendc itself, as the official one does
        run: |
          # bendc has defs that rely on foreign code, so both report them and exit 1
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" bendc.bend > build/ours.txt 2>&1 \
            && echo "exit 0" >> build/ours.txt || echo "exit $?" >> build/ours.txt
          BEND_NO_TELEMETRY=1 bend bendc.bend --check-only > build/official.txt 2>&1 \
            && echo "exit 0" >> build/official.txt || echo "exit $?" >> build/official.txt
          cmp build/ours.txt build/official.txt
          # check.bend has no unsafe or foreign def: both accept it outright
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" check.bend
          BEND_NO_TELEMETRY=1 bend check.bend --check-only

      - name: Erasure preserves the core IR's semantics (PROOF.bend, both checkers)
        run: |
          BEND_NO_TELEMETRY=1 bend PROOF.bend --check-only
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" PROOF.bend

      - name: Reducing applied lambdas preserves it (REDPROOF.bend, both checkers)
        run: |
          BEND_NO_TELEMETRY=1 bend REDPROOF.bend --check-only
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" REDPROOF.bend

      - name: Resolving matches on known constructors preserves it (KNOWNPROOF.bend, both checkers)
        run: |
          BEND_NO_TELEMETRY=1 bend KNOWNPROOF.bend --check-only
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" KNOWNPROOF.bend

      - name: Dropping dead lets preserves it (DEADPROOF.bend, both checkers)
        run: |
          BEND_NO_TELEMETRY=1 bend DEADPROOF.bend --check-only
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" DEADPROOF.bend

      - name: Putting let-bound numbers in place of their lookups preserves it (LITPROOF.bend, both checkers)
        run: |
          BEND_NO_TELEMETRY=1 bend LITPROOF.bend --check-only
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" LITPROOF.bend

      - name: Inlining calls of global defs preserves it (INLINEPROOF.bend, both checkers)
        run: |
          BEND_NO_TELEMETRY=1 bend INLINEPROOF.bend --check-only
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" INLINEPROOF.bend

      - name: Substituting atoms and single-use lets preserves it (SUBSTPROOF.bend, both checkers)
        run: |
          BEND_NO_TELEMETRY=1 bend SUBSTPROOF.bend --check-only
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" SUBSTPROOF.bend

      - name: Lowering and raising round-trip, and lowered defs never fail a lookup (LOPROOF.bend, both checkers)
        run: |
          BEND_NO_TELEMETRY=1 bend LOPROOF.bend --check-only
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" LOPROOF.bend

      - name: The optimizer's rewrites as proven laws (OPT.bend, both checkers)
        run: |
          BEND_NO_TELEMETRY=1 bend OPT.bend --check-only
          ./build/bendc --check-only "$HOME/.bend/bend2/base.bend" OPT.bend

      - name: Full bootstrap (official bend -> stage1 -> stage2 fixpoint)
        run: BEND_NO_TELEMETRY=1 ./bootstrap.sh

  # Diverse double-compiling: the official Bend with GCC, and the seed with
  # GCC, must both compile bendc.bend to the seed (tools/ddc.sh). On macOS
  # because the official C needs GCC 15+ (musttail), which Homebrew has.
  ddc:
    name: diverse double-compiling
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the official Bend
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) BEND_NO_TELEMETRY=1 tools/install-bend.sh latest;;
            *) tools/install-bend.sh;;
          esac
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"

      - name: Install GCC
        run: brew install gcc

      - name: Two toolchains, one seed
        run: make ddc

  # The Tiny C Compiler, which bootstrappable builds reach from a hex seed:
  # it builds bendc, which compiles bendc.bend to the seed, and the test
  # programs with the runtime (tools/tcc.sh). tinycc's mob branch, pinned:
  # 0.9.27, the last release, has no stdatomic.h.
  tcc:
    name: tcc
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install the official Bend (for base.bend)
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) BEND_NO_TELEMETRY=1 tools/install-bend.sh latest;;
            *) tools/install-bend.sh;;
          esac
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"

      - name: Build tinycc
        run: |
          git clone https://repo.or.cz/tinycc.git /tmp/tinycc
          cd /tmp/tinycc && git checkout 9db1105c32afd3dcf0c28b8186f08e63c761b2b5
          ./configure --prefix="$HOME/tcc" && make -j4 && make install
          echo "$HOME/tcc/bin" >> "$GITHUB_PATH"

      - name: tcc builds bendc, and the tests pass
        run: make tcc

  # The bootstrap from source: boot/bendi, a Bend interpreter written by
  # hand in C99, runs bendc.bend on its own source, and the C it writes is
  # the seed byte for byte (tools/boot.sh). Built by GCC, and by tcc.
  boot:
    name: boot from source
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install the official Bend (for base.bend)
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) BEND_NO_TELEMETRY=1 tools/install-bend.sh latest;;
            *) tools/install-bend.sh;;
          esac

      - name: Build tinycc
        run: |
          git clone https://repo.or.cz/tinycc.git /tmp/tinycc
          cd /tmp/tinycc && git checkout 9db1105c32afd3dcf0c28b8186f08e63c761b2b5
          ./configure --prefix="$HOME/tcc" && make -j4 && make install
          echo "$HOME/tcc/bin" >> "$GITHUB_PATH"

      - name: bendi, built by GCC, compiles bendc.bend to the seed
        run: make boot BOOTCC=gcc

      - name: bendi, built by tcc, compiles bendc.bend to the seed
        run: make boot BOOTCC=tcc
